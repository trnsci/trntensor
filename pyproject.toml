[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trntensor"
version = "0.17.0"
description = "Tensor contractions for AWS Trainium via NKI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Scott Friedman", email = "scttfrdmn@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
neuron = [
    # PyTorch/XLA lineage (Trn1, and Trn2 on PyTorch 2.9). NKI 0.3.0 Stable
    # (Neuron SDK 2.29) promotes `nki.*` as the canonical namespace. Ships with
    # the Deep Learning AMI Neuron or via https://pip.repos.neuron.amazonaws.com.
    "nki>=0.3.0",
    "torch-neuronx>=2.9",
]
torchneuron = [
    # TorchNeuron / native PyTorch (Neuron SDK 2.33+, Trn2/Trn3; torch-neuronx
    # 2.14 itself requires Python >= 3.12). Install with
    # --extra-index-url https://pip.repos.neuron.amazonaws.com. The nki floor
    # also keeps pip off the unrelated `nki` 0.0.1 on public PyPI.
    "torch>=2.14",
    "torch-neuronx>=2.14",
    "nki>=0.6",
]
dev = [
    "pytest>=7.0,<9",  # pytest-benchmark 5.3 breaks on pytest 9 (Function._nodeid)
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "scipy>=1.11",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/trnsci/trntensor"
Documentation = "https://trnsci.dev/trntensor/"
Repository = "https://github.com/trnsci/trntensor"
Issues = "https://github.com/trnsci/trntensor/issues"

[tool.setuptools.packages.find]
include = ["trntensor*"]

# Neuron SDK note: on-hardware runs use the AWS Deep Learning AMI's
# pre-built venv at /opt/aws_neuronx_venv_pytorch_*, which bundles
# the NKI runtime. The DLAMI's terraform `most_recent = true` pulls the
# current image and its venv tracks the current SDK. Outside the DLAMI, use
# the `[torchneuron]` (Trn2/Trn3, native) or `[neuron]` (Trn1, PyTorch/XLA)
# extra with the Neuron pip repo. Both lineages publish a package named
# `torch-neuronx`, so pip markers cannot pick between them; choose the extra
# that matches the instance. The base dependency set stays CPU-only and
# resolves cleanly from PyPI.

[tool.ruff]
# Match the rest of the trnsci suite. Line length 100 is a compromise
# between black's 88 and the wider tables common in scientific code.
line-length = 100
target-version = "py310"
extend-exclude = ["site", "infra/terraform*/.terraform"]

[tool.ruff.lint]
# Sensible default selection: pycodestyle (E/W), Pyflakes (F), isort (I),
# pyupgrade (UP), flake8-bugbear (B), flake8-simplify (SIM). Skip docstring
# rules (D*) — we're deliberately light on docstrings in this project.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — formatter handles it
    "B008",   # function call in default arg — common + intentional here
]

[tool.ruff.lint.per-file-ignores]
# NKI kernels use patterns that trip some lint rules (SBUF writes that
# look unused to the linter, etc). Don't fight the kernel authoring loop.
"trntensor/nki/_kernels.py" = ["F841", "B007"]
"trntensor/nki/dispatch.py" = ["F841", "B007"]
"scripts/*" = ["F401"]
"tests/*"   = ["F401", "F811"]

[tool.ruff.format]
# Black-compatible defaults.
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "neuron: requires Neuron hardware",
    "neuron_sr: stochastic-rounding hardware test; needs NEURON_RT_STOCHASTIC_ROUNDING_EN=1 at process start",
]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
