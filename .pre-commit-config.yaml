# Install locally: pip install pre-commit && pre-commit install
# Runs on `git commit`; ruff auto-fixes staged Python files then formats them.
# CI re-checks the same rules in the lint job — pre-commit keeps CI green.

repos:
  # Keep rev in lockstep with the ruff pin in .github/workflows/ci.yml
  # (and the [dev] extra in pyproject.toml) so local and CI agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
